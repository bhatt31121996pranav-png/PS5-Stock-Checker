name: PS5 Stock Checker

on:
  schedule:
    # Runs every 10 minutes. GitHub may delay this slightly during high load.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated state.json

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state"
          git push
